map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
  listen 8000;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Maximum upload size
  client_max_body_size 5G;

  # API proxy
  # The /mcp alternative matches the bare path with no trailing slash (that's how MCP
  # clients POST to it) as well as any sub-path -- the other prefixes above only match
  # with a trailing slash, which would otherwise let /mcp fall through to the SPA and
  # return index.html instead of the API's 401 challenge.
  location ~ ^/(api|.well-known|oauth|login|share|swagger)/|^/mcp(/|$) {
    proxy_pass http://localhost:8080;
    proxy_http_version 1.1;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Forward important headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Always overwrite (never merge) X-Forwarded-Host with nginx's own resolved $host, the
    # same value already trusted for the Host header above. The API's ForwardedHeadersOptions
    # clears KnownProxies/KnownNetworks (this proxy's address isn't static across deployments),
    # so it trusts X-Forwarded-Host from any upstream -- that value is what OAuthController's
    # same-origin redirect_uri checks (IsApiRedirectUri/IsAppRedirectUri) compare against.
    # proxy_set_header replaces rather than appends, so a client-supplied X-Forwarded-Host can
    # never reach the API; without this line it passed through unmodified.
    proxy_set_header X-Forwarded-Host $host;

    # Optional: disable buffering for APIs like SSE/WebSockets
    proxy_buffering off;
    proxy_buffer_size 256k;
    proxy_buffers 4 512k;
    proxy_busy_buffers_size 512k;

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Frontend (SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  large_client_header_buffers 4 32k;
}